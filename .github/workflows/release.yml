name: Release

# פרסום דרך ה-Action הרשמי של אוצריא. הוא מאמת באותן בדיקות שרצות בחנות,
# בונה את ה-.otzplugin, ומפרסם — ומזהה את התוסף לפי ה-id שב-manifest.json,
# ולכן אין צורך במזהה החנות כסוד.
#
# מדוע לא תהליך משלנו: התהליך הקודם התחבר לחנות בעצמו מול
# /api/auth/callback/credentials. כשחוזה ההתחברות השתנה בצד השרת הוא נשבר
# ("פרטי התחברות שגויים") בזמן שאותם פרטים עבדו מהדפדפן. ה-Action הרשמי
# מתוחזק יחד עם החנות, ולכן שינוי כזה מטופל שם ולא אצלנו.
#
# הפרסום מדולג מאליו כשהגרסה שב-manifest כבר קיימת בחנות, ולכן דחיפה
# שאינה מעלה גרסה אינה עושה דבר.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Validate, build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from manifest
        id: v
        run: |
          version=$(node -p "require('./src/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version"   >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "tagged=true"  >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate, build and publish to the store
        id: otzaria
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: src
          build: 'true'
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}

      # ה-Action אינו יוצר Release בגיטהאב, וזה נשאר שימושי: הוא נותן קובץ
      # להתקנה ידנית כשהחנות אינה זמינה, וגם היסטוריית גרסאות במאגר עצמו.
      - name: Create GitHub Release
        if: steps.v.outputs.tagged == 'false' && steps.otzaria.outputs.plugin-file != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: ${{ steps.otzaria.outputs.plugin-file }}
          body: |
            ## ביוגרפיות — ${{ steps.v.outputs.tag }}

            ### התקנה
            מי שהתקין מהחנות מקבל את העדכון אוטומטית. להתקנה ידנית הורידו את
            קובץ ה-`.otzplugin` שלמטה, ובאוצריא: **הגדרות → ניהול תוספים → התקנה מקובץ**.

            ### Checksum
            ```
            SHA-256: ${{ steps.otzaria.outputs.sha256 }}
            ```

      - name: Summary
        run: |
          echo "גרסה: ${{ steps.v.outputs.version }}"
          echo "אימות עבר: ${{ steps.otzaria.outputs.passed }}"
          echo "פורסם לחנות: ${{ steps.otzaria.outputs.published }}"
          echo "ממתין לאישור מנהל: ${{ steps.otzaria.outputs.pending-approval }}"
