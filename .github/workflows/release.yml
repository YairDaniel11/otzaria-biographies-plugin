name: Release

# כל דחיפה ל-main שמשנה את הגרסה ב-src/manifest.json מפרסמת אוטומטית:
# בנייה -> תג + GitHub Release -> עדכון החנות ב-otzaria.org.
# אם הגרסה לא השתנתה (כלומר כבר קיים תג לגרסה הזו) — הריצה מדלגת בשקט,
# כי החנות דוחה ממילא העלאה של גרסה שכבר קיימת.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_SLUG: otzaria-biographies

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: v
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content 'src/manifest.json' -Raw -Encoding UTF8
          $version = ($manifest.TrimStart([char]0xFEFF) | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "manifest version must look like X.Y.Z (got '$version')"
            exit 1
          }
          $tag = "v$version"
          # קיום התג הוא הסימן לכך שהגרסה הזו כבר פורסמה
          $exists = (git tag --list $tag)
          if ($exists) {
            Write-Host "::notice::$tag already released — nothing to publish"
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "::notice::new version $version — will publish as $tag"
            "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build plugin
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        run: .\build.ps1

      # הבדיקות כאן תופסות מראש כשלים שאוצריא והחנות מחזירות רק בזמן
      # ההתקנה: manifest שלא בשורש הארכיון, name שאינו זהה לכותרת הלשונית,
      # ותיאור ארוך מ-150 תווים.
      - name: Verify package contents
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -Assembly System.IO.Compression.FileSystem
          $file = "$PWD\$env:PLUGIN_SLUG.otzplugin"
          $z = [System.IO.Compression.ZipFile]::OpenRead($file)
          $z.Entries | ForEach-Object { "{0,12}  {1}" -f $_.Length, $_.FullName }
          $entry = $z.Entries | Where-Object { $_.FullName -eq 'manifest.json' }
          if (-not $entry) {
            $z.Dispose()
            Write-Error "manifest.json missing from package root"
            exit 1
          }
          $reader = New-Object System.IO.StreamReader($entry.Open())
          $json = $reader.ReadToEnd()
          $reader.Dispose()
          $z.Dispose()
          $m = $json.TrimStart([char]0xFEFF) | ConvertFrom-Json
          if ($m.version -ne '${{ steps.v.outputs.version }}') {
            Write-Error "packaged version $($m.version) != manifest version ${{ steps.v.outputs.version }}"
            exit 1
          }
          if ($m.name -ne $m.contributes.toolTab.title) {
            Write-Error "manifest 'name' ($($m.name)) must equal contributes.toolTab.title ($($m.contributes.toolTab.title)) or Otzaria refuses to install"
            exit 1
          }
          if ($m.description.Length -gt 150) {
            Write-Error "manifest description is $($m.description.Length) chars — the limit is 150"
            exit 1
          }
          Write-Host "OK: version $($m.version), name '$($m.name)', description $($m.description.Length) chars"

      - name: Compute SHA-256
        id: sha
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 ".\$env:PLUGIN_SLUG.otzplugin").Hash.ToLower()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "SHA-256: $hash"

      - name: Name the release asset with its version
        if: steps.v.outputs.publish == 'true'
        shell: pwsh
        run: |
          Copy-Item ".\$env:PLUGIN_SLUG.otzplugin" ".\$env:PLUGIN_SLUG-v${{ steps.v.outputs.version }}.otzplugin"

      - name: Create GitHub Release
        if: steps.v.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ env.PLUGIN_SLUG }}-v${{ steps.v.outputs.version }}.otzplugin
          body: |
            ## ביוגרפיות — ${{ steps.v.outputs.tag }}

            ### התקנה
            הורידו את קובץ ה-`.otzplugin` שלמטה, ובאוצריא:
            **הגדרות → ניהול תוספים → התקנה מקובץ**.
            מי שהתקין מהחנות מקבל את העדכון אוטומטית.

            ### Checksum
            ```
            SHA-256: ${{ steps.sha.outputs.sha256 }}
            ```

      # מתפרסם לחנות רק כששלושת הסודות מוגדרים במאגר. בלעדיהם השלב מדולג
      # בשקט וה-Release עדיין נוצר, כך שאפשר להתקין ידנית מהקובץ.
      - name: Publish update to otzaria.org
        # הקשר secrets אינו זמין ב-if של שלב; env כן, והוא מוגדר למטה.
        if: ${{ steps.v.outputs.publish == 'true' && env.OTZARIA_USER != '' && env.OTZARIA_PASSWORD != '' && env.OTZARIA_PLUGIN_ID != '' }}
        shell: pwsh
        env:
          OTZARIA_BASE_URL: ${{ vars.OTZARIA_BASE_URL }}
          OTZARIA_USER: ${{ secrets.OTZARIA_USER }}
          OTZARIA_PASSWORD: ${{ secrets.OTZARIA_PASSWORD }}
          OTZARIA_PLUGIN_ID: ${{ secrets.OTZARIA_PLUGIN_ID }}
          NEW_VERSION: ${{ steps.v.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginFile = "$env:PLUGIN_SLUG.otzplugin"
          $base = if ($env:OTZARIA_BASE_URL) { $env:OTZARIA_BASE_URL.TrimEnd('/') } else { 'https://otzaria.org' }

          # 1) CSRF token (cookie persisted in $sess)
          $csrf = Invoke-RestMethod -Uri "$base/api/auth/csrf" -SessionVariable sess -UseBasicParsing
          if (-not $csrf.csrfToken) { Write-Error 'Failed to fetch CSRF token'; exit 1 }

          # 2) Credentials login (NextAuth Credentials provider)
          $loginBody = @{
            csrfToken   = $csrf.csrfToken
            identifier  = $env:OTZARIA_USER
            password    = $env:OTZARIA_PASSWORD
            callbackUrl = "$base/library/admin/plugins"
            json        = 'true'
          }
          try {
            $null = Invoke-WebRequest -Uri "$base/api/auth/callback/credentials" `
              -Method Post -Body $loginBody -WebSession $sess `
              -UseBasicParsing -MaximumRedirection 5
          } catch {
            Write-Error "Login request failed: $($_.Exception.Message)"; exit 1
          }

          # 3) Verify session (admin OR plugin owner — backend enforces ownership)
          $session = Invoke-RestMethod -Uri "$base/api/auth/session" -WebSession $sess -UseBasicParsing
          if (-not $session.user) {
            Write-Error 'Login failed: empty session (check OTZARIA_USER / OTZARIA_PASSWORD)'; exit 1
          }
          Write-Host "Logged in as $($session.user.email) (role: $($session.user.role))"

          # 4) Fetch current plugin fields (admin edit endpoint)
          $editUrl = "$base/api/admin/plugins/$env:OTZARIA_PLUGIN_ID/edit"
          $current = Invoke-RestMethod -Uri $editUrl -WebSession $sess -UseBasicParsing
          Write-Host "Current site version: $($current.version) -> new: $env:NEW_VERSION"

          if (-not (Test-Path $pluginFile)) {
            Write-Error "Plugin file not found: $pluginFile"; exit 1
          }

          # 5) Build multipart and PUT the update
          $tagsJson = ConvertTo-Json -InputObject @($current.tags) -Compress
          if ($tagsJson -eq 'null') { $tagsJson = '[]' }

          $form = @{
            name             = $current.name
            shortDescription = $current.shortDescription
            description      = $current.description
            version          = $env:NEW_VERSION
            status           = $current.status
            author           = $current.author
            compatibleWith   = $current.compatibleWith
            requiresNetwork  = if ($current.requiresNetwork) { 'true' } else { 'false' }
            tags             = $tagsJson
            homepage         = if ($current.homepage) { $current.homepage } else { '' }
            pluginFile       = Get-Item -Path $pluginFile
          }

          $result = Invoke-RestMethod -Uri $editUrl -Method Put -Form $form -WebSession $sess -UseBasicParsing
          $result | ConvertTo-Json -Depth 5
          Write-Host "::notice::Plugin updated on $base (version $env:NEW_VERSION)"
